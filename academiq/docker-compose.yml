version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped

  # Optional: shared ChromaDB server for multi-engineer write access (DR-05).
  # The default app config uses an embedded persistent client and does NOT need
  # this service. Enable it and point CHROMA_* at it only for team ingestion.
  # chromadb:
  #   image: chromadb/chroma:latest
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - ./storage/chroma_server:/chroma/chroma
  #   environment:
  #     - ALLOW_RESET=false
  #   restart: unless-stopped
