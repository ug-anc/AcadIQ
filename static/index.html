<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask IITK — Academic Policy Assistant</title>
<style>
  :root {
    --paper: #faf8f3;
    --ink: #1c1b19;
    --muted: #6f6a61;
    --line: #e4ded2;
    --navy: #1d3557;
    --navy-soft: #eaeef5;
    --amber: #9a6700;
    --amber-soft: #fbf3e0;
    --stop: #8a2b2b;
    --stop-soft: #f7e9e9;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 22px 20px;
    text-align: center;
  }
  header .mark {
    font-weight: 700; letter-spacing: -0.02em; font-size: 22px;
  }
  header .mark span { color: var(--navy); }
  header .tag { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main {
    max-width: 760px; margin: 0 auto; padding: 24px 20px 140px;
  }
  .turn { margin-bottom: 26px; }
  .you {
    text-align: right;
  }
  .you .bubble {
    display: inline-block; background: var(--navy); color: #fff;
    padding: 10px 14px; border-radius: var(--radius) var(--radius) 2px var(--radius);
    max-width: 80%; text-align: left;
  }
  .bot .band {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 4px 10px; border-radius: 999px;
    margin-bottom: 10px;
  }
  .band.found { background: var(--navy-soft); color: var(--navy); }
  .band.low_confidence { background: var(--amber-soft); color: var(--amber); }
  .band.not_found { background: var(--stop-soft); color: var(--stop); }
  .band .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .answer {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px; white-space: pre-wrap;
    border-left: 3px solid var(--line); padding: 2px 0 2px 16px;
  }
  .meta { color: var(--muted); font-size: 12px; margin-top: 10px; }
  details.sources {
    margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; overflow: hidden;
  }
  details.sources summary {
    cursor: pointer; padding: 10px 14px; font-size: 13px; font-weight: 600;
    color: var(--navy); list-style: none;
  }
  details.sources summary::-webkit-details-marker { display: none; }
  details.sources summary::after { content: " ▸"; }
  details.sources[open] summary::after { content: " ▾"; }
  .cite {
    border-top: 1px solid var(--line); padding: 12px 14px; font-size: 13px;
  }
  .cite .ref { font-weight: 600; }
  .cite .excerpt { color: var(--muted); font-style: italic; margin-top: 3px; }
  .fb { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  .fb button {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 4px 10px; cursor: pointer; font-size: 14px;
  }
  .fb button:hover { border-color: var(--navy); }
  .fb .done { color: var(--muted); font-size: 12px; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, var(--paper) 24px);
    padding: 18px 20px;
  }
  .composer {
    max-width: 760px; margin: 0 auto; display: flex; gap: 10px;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 8px 8px 14px;
  }
  .composer input {
    flex: 1; border: 0; outline: 0; font-size: 16px; background: transparent;
    color: var(--ink);
  }
  .composer button {
    background: var(--navy); color: #fff; border: 0; border-radius: 8px;
    padding: 0 18px; font-weight: 600; cursor: pointer;
  }
  .composer button:disabled { opacity: 0.5; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <div class="mark">
      <img src="https://anc-website-blond.vercel.app/_next/image?url=%2Fimages%2Flogo%2Fanc_logo2.png&w=128&q=75" alt="AnC IITK Logo" style="height: 40px; margin-right: 10px;" />
      Ask<span>IITK</span>
    </div>
    <div class="tag">Answers only from official college documents — every claim cited.</div>
  </header>

  <main id="thread">
    <div class="turn bot">
      <div class="band found"><span class="dot"></span>Ready</div>
      <div class="answer">Ask about credits, grading, attendance, backlogs, or branch-change rules. If the documents don't cover it, I'll say so rather than guess.</div>
    </div>
  </main>

  <footer>
    <form class="composer" id="form">
      <input id="q" autocomplete="off" placeholder="e.g. What is the minimum attendance requirement?" />
      <button id="send" type="submit">Ask</button>
    </form>
    <div class="hint">A correct "not found" beats a confident wrong answer.</div>
  </footer>

<script>
  const API = "/api/v1/query";
  const FEEDBACK = "/api/v1/feedback";
  const SESSION = crypto.randomUUID();
  const thread = document.getElementById("thread");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  function addUser(text) {
    const el = document.createElement("div");
    el.className = "turn you";
    el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    thread.appendChild(el);
    scroll();
  }

  function bandLabel(band) {
    return { found: "Verified", low_confidence: "Low confidence", not_found: "Not found" }[band] || band;
  }

  function addBot(data, query) {
    const el = document.createElement("div");
    el.className = "turn bot";
    let html = `<div class="band ${data.confidence_band}"><span class="dot"></span>${bandLabel(data.confidence_band)}</div>`;
    html += `<div class="answer">${esc(data.answer)}</div>`;
    if (data.citations && data.citations.length) {
      html += `<details class="sources"><summary>${data.citations.length} source${data.citations.length > 1 ? "s" : ""} referenced</summary>`;
      for (const c of data.citations) {
        html += `<div class="cite"><div class="ref">${esc(c.document_name)} · Section ${esc(c.section)} · Page ${c.page_number}</div>`;
        if (c.excerpt) html += `<div class="excerpt">"${esc(c.excerpt)}"</div>`;
        html += `</div>`;
      }
      html += `</details>`;
    }
    const score = (data.confidence_score ?? 0).toFixed(3);
    const lat = (data.retrieval_latency_ms || 0) + (data.generation_latency_ms || 0);
    html += `<div class="meta">confidence ${score} · ${lat} ms${data.cached ? " · cached" : ""}</div>`;
    html += `<div class="fb"><button data-v="1">👍 Helpful</button><button data-v="0">👎 Not helpful</button></div>`;
    el.innerHTML = html;
    thread.appendChild(el);

    el.querySelectorAll(".fb button").forEach((b) =>
      b.addEventListener("click", async () => {
        await fetch(FEEDBACK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: SESSION, query, answer: data.answer,
            helpful: b.dataset.v === "1",
          }),
        }).catch(() => {});
        el.querySelector(".fb").innerHTML = '<span class="done">Thanks — feedback recorded.</span>';
      })
    );
    scroll();
  }

  function scroll() { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    addUser(q);
    input.value = "";
    send.disabled = true;
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q, session_id: SESSION }),
      });
        console.log("Request sent to API with query:", q, SESSION);  // Debugging statement

      if (res.status === 422) {
        console.log(res); // debugging TODO: remove DURING PROD
        addBot({ answer: "That query was rejected by the input guard.", confidence_band: "not_found", citations: [], confidence_score: 0 }, q);
      } else {
        addBot(await res.json(), q);
      }
    } catch (err) {
      addBot({ answer: "Could not reach the server. Is the API running?", confidence_band: "not_found", citations: [], confidence_score: 0 }, q);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
